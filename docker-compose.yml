services:

  postgres:

    image: postgres:16

    container_name: supply_chain_postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql


  loader:

    build: .

    container_name: supply_chain_loader

    depends_on:
      - postgres

    env_file:
      - .env

    command: python scripts/load_database.py


  dashboard:

    build: .

    container_name: supply_chain_dashboard

    depends_on:
      - loader

    ports:
      - "8501:8501"

    env_file:
      - .env


volumes:

  postgres_data: